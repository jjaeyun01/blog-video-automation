[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fevercoach-shorts"
version = "0.1.0"
description = "Weekly blog and character image to vertical AI Shorts pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-genai>=1.74,<3",
  "pillow>=10,<13",
  "requests>=2.31,<3",
]

[project.scripts]
fevercoach-shorts = "fevercoach_shorts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
